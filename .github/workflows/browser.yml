name: Runtime in a browser
# ctm-runtime in Chromium: Pyodide from jsDelivr, the guard module, SymPy;
# and SymPy results under the runtime's Pyodide equal those of the previous one.
# The page's interface (reveals, the lecture/reading switch, links into tabs,
# also under coi-serviceworker) on a rendered site in Chromium, Firefox and
# WebKit. CTMWorker (the Python worker) in Chromium with real Pyodide from a
# local server like jsDelivr: the browser cache, a check during stage 2 on a
# slow line, no starvation, a stalled download, a restart, input() and Stop
# through coi-serviceworker.js, and a project that pins Pyodide 0.27.2.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Runtime smoke test
        run: node tests/browser/runtime-smoke.mjs
      - name: SymPy results equal those of the previous Pyodide
        run: node tests/browser/sympy-parity.mjs
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: CTMWorker in Chromium
        env:
          PYODIDE_OLD: '0.27.2'
        run: node tests/browser/worker.mjs
  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - run: npm install --no-save --ignore-scripts playwright@1.55.1 coi-serviceworker@0.1.7
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Links into tabs and reveals, the switch (${{ matrix.browser }})
        run: node tests/browser/ui.mjs ${{ matrix.browser }}

      - name: Saved answers, copy and export (${{ matrix.browser }})
        run: node tests/browser/store.mjs ${{ matrix.browser }}
