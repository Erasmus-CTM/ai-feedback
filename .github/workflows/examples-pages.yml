name: Test, render and publish examples

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0 networkx==3.4.2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render and exercise the examples
        run: python scripts/setup-feedback-integration.py --test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all consumers on examples.qmd
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-examples
          path: .feedback-workspace/site/_site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .feedback-workspace/site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: ai-feedback-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy examples
        id: deployment
        uses: actions/deploy-pages@v4
