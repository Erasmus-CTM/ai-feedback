lang: en
project:
  type: website
  output-dir: _site
  resources:
    - resolved-repos.json
  render:
    - index.qmd
    - examples.qmd
website:
  title: AI Feedback
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: examples.qmd
        text: Working examples
format:
  html:
    toc: true
    theme: cosmo
filters:
  - ai-feedback
ai-feedback:
  mode: copy
  storage: local
pyodide:
  packages: []
  show-startup-message: false
  feedback: true
  feedback-storage: session
py-exercise:
  feedback: true
  show-test-hints: true
  submission: false
